# BEA DIGITAL — GitLab CI/CD
# Docs : docs/deployment/05-pipeline-gitlab.md
# Runner prod : tag bea-prod (réseau BEA). Deploy = manuel.

stages:
  - validate
  - test
  - security
  - build
  - publish
  - deploy_production

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------
validate:structure:
  stage: validate
  image: alpine:3.20
  script:
    - test -d backend
    - test -d frontend/angular20
    - test -f backend/Dockerfile
    - test -f frontend/Dockerfile
    - test -f deployment/docker-compose.prod.yml
    - test -f deployment/scripts/deploy.sh
    - test -f deployment/scripts/backup-pre-deploy.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
test:backend:
  stage: test
  image: python:3.13-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - pytest -q
    - python -c "from app.main import app; print(app.title)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:frontend:
  stage: test
  image: node:22-alpine
  before_script:
    - cd frontend/angular20
    - npm ci
  script:
    - npm run build -- --configuration=development
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# security (basique — étendre avec politique BEA / scanners DSI)
# ---------------------------------------------------------------------------
security:secrets-scan:
  stage: security
  image: alpine:3.20
  script:
    - |
      set -e
      # Fichiers qui ne doivent jamais être versionnés
      for f in .env .env.docker .env.production id_rsa id_ed25519; do
        if [ -f "$f" ]; then
          echo "Fichier sensible versionné: $f" >&2
          exit 1
        fi
      done
      # Motifs grossiers dans le dépôt (hors exemples)
      if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
          --exclude='*.example' --exclude='*.md' --exclude='.gitlab-ci.yml' \
          -E 'POSTGRES_PASSWORD=[A-Za-z0-9]{12,}|SECRET_KEY=[A-Za-z0-9]{32,}' . ; then
        echo "Secret potentiel détecté (voir ci-dessus)" >&2
        exit 1
      fi
      echo "Scan basique OK"
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

security:sonar:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.projectBaseDir=.
  rules:
    - if: $SONAR_TOKEN
      when: on_success
    - when: never
  allow_failure: true

# ---------------------------------------------------------------------------
# build + publish (tags SemVer v*)
# ---------------------------------------------------------------------------
.build_template: &build_docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build:images:
  stage: build
  <<: *build_docker
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      docker build \
        --build-arg APP_VERSION="$TAG" \
        --build-arg GIT_SHA="$CI_COMMIT_SHORT_SHA" \
        -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$BACKEND_IMAGE:$TAG" \
        backend
      docker build \
        -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$FRONTEND_IMAGE:$TAG" \
        frontend
      # Sauvegarder pour publish éventuel via artifact local (ré-tag en publish)
      mkdir -p .ci-images
      docker save "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -o .ci-images/bea-images.tar
  artifacts:
    paths:
      - .ci-images/bea-images.tar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:registry:
  stage: publish
  <<: *build_docker
  needs:
    - job: build:images
      artifacts: true
  script:
    - |
      set -e
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      docker load -i .ci-images/bea-images.tar
      docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$BACKEND_IMAGE:$TAG"
      docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:$TAG"
      docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$BACKEND_IMAGE:$TAG"
      docker push "$FRONTEND_IMAGE:$TAG"
      echo "Published backend/frontend : $TAG + $CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ---------------------------------------------------------------------------
# deploy production (manuel, runner réseau BEA)
# ---------------------------------------------------------------------------
deploy:production:
  stage: deploy_production
  image: alpine:3.20
  tags:
    - bea-prod
  needs:
    - job: publish:registry
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY manquant (variable GitLab)" >&2
        exit 1
      fi
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -n "${DEPLOY_HOST:-}" ]; then
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      fi
  script:
    - |
      set -euo pipefail
      : "${DEPLOY_HOST:?DEPLOY_HOST requis}"
      : "${DEPLOY_USER:?DEPLOY_USER requis}"
      : "${DEPLOY_PATH:?DEPLOY_PATH requis}"
      TAG="${CI_COMMIT_TAG:?deploy production réservé aux tags v*}"
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
      set -euo pipefail
      cd "${DEPLOY_PATH}"
      export BEA_VERSION="${TAG}"
      export GIT_SHA="${CI_COMMIT_SHORT_SHA}"
      export BEA_IMAGE_BACKEND="${BACKEND_IMAGE}"
      export BEA_IMAGE_FRONTEND="${FRONTEND_IMAGE}"
      export ENV_FILE=".env.production"
      export COMPOSE_FILE="deployment/docker-compose.prod.yml"
      bash deployment/scripts/backup-pre-deploy.sh
      bash deployment/scripts/deploy.sh
      EOF
  environment:
    name: production
    url: $PRODUCTION_URL
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
