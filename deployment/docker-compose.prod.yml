# BEA DIGITAL — compose production (serveur banque)
#
# Usage (sur le serveur, après inventaire IT) :
#   export BEA_VERSION=v1.5.0
#   export BEA_IMAGE_BACKEND=registry.example/bea-digital/backend
#   export BEA_IMAGE_FRONTEND=registry.example/bea-digital/frontend
#   docker compose --env-file .env.production -f deployment/docker-compose.prod.yml up -d
#
# Ne JAMAIS : docker compose down -v
# PostgreSQL : pas de port publié vers l'extérieur.
# TEST/PROD banque : image Debian postgres:17 (pas Alpine).

services:
  postgres:
    image: postgres:17
    pull_policy: if_not_present
    container_name: bea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bea_digital}
      POSTGRES_USER: ${POSTGRES_USER:-bea_digital_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    # Pas de ports: publics — accès uniquement via réseau Docker interne.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
      - ../backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bea_digital_app} -d ${POSTGRES_DB:-bea_digital}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bea_internal

  backend:
    image: ${BEA_IMAGE_BACKEND:?BEA_IMAGE_BACKEND manquant}:${BEA_VERSION:?BEA_VERSION manquant}
    pull_policy: always
    container_name: bea-backend
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_VERSION: ${BEA_VERSION}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bea_digital_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bea_digital}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-1}
    volumes:
      - ../storage/uploads:/app/storage/uploads
      - ../storage/ged:/app/storage/ged
      - ../backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bea_internal

  frontend:
    image: ${BEA_IMAGE_FRONTEND:?BEA_IMAGE_FRONTEND manquant}:${BEA_VERSION:?BEA_VERSION manquant}
    pull_policy: always
    container_name: bea-frontend
    restart: unless-stopped
    # Exposé uniquement sur le réseau hôte local / reverse proxy.
    # Le proxy HTTPS (hôte) pointe vers 127.0.0.1:8080 (ou équivalent IT).
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bea_internal

volumes:
  postgres_data:
    name: bea_postgres_data

networks:
  bea_internal:
    name: bea_internal
    driver: bridge
