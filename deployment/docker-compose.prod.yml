# BEA DIGITAL — compose TEST / PRODUCTION (serveur banque)
#
# Ne pas lancer à la main : passer par deployment/scripts/deploy.sh
# (sauvegarde vérifiée, migrations contrôlées, contrôle de santé, retour arrière).
#
#   ENV_FILE=.env.production BEA_VERSION=v1.6.0 ./deployment/scripts/deploy.sh
#
# Ne JAMAIS : docker compose down -v (le -v efface PostgreSQL).
# PostgreSQL et Redis : aucun port publié, réseau Docker interne uniquement.
# TEST/PROD banque : image Debian postgres:17 (pas Alpine), collation alignée sur le dump.
# Migrations : jamais au démarrage du conteneur (SKIP_MIGRATIONS=1) ; deploy.sh les applique
# après la sauvegarde, avec l'image de la nouvelle version.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: "false"
  APP_VERSION: ${BEA_VERSION}
  GIT_SHA: ${GIT_SHA:-unknown}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bea_digital_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bea_digital}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  SKIP_MIGRATIONS: "1"
  # Proxys autorisés à transmettre l'IP cliente : conteneur frontend + passerelle du reverse proxy
  # HTTPS de l'hôte (à fournir par l'IT, voir env.production.example).
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-frontend}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  GED_DIR: storage/ged

services:
  postgres:
    image: postgres:17
    pull_policy: missing
    container_name: bea-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bea_digital}
      POSTGRES_USER: ${POSTGRES_USER:-bea_digital_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bea_digital_app} -d ${POSTGRES_DB:-bea_digital}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bea_internal

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: bea-redis
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bea_internal

  backend:
    image: ${BEA_IMAGE_BACKEND:-bea-digital/backend}:${BEA_VERSION:?BEA_VERSION manquant}
    pull_policy: missing
    container_name: bea-backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - ${ENV_FILE_PATH:-../.env.production}
    environment: *backend-env
    volumes:
      - ../storage/uploads:/app/storage/uploads
      - ../storage/ged:/app/storage/ged
      - ../backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bea_internal

  worker:
    image: ${BEA_IMAGE_BACKEND:-bea-digital/backend}:${BEA_VERSION:?BEA_VERSION manquant}
    pull_policy: missing
    container_name: bea-worker
    restart: unless-stopped
    logging: *logging
    env_file:
      - ${ENV_FILE_PATH:-../.env.production}
    environment: *backend-env
    volumes:
      - ../storage/uploads:/app/storage/uploads
      - ../storage/ged:/app/storage/ged
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["celery"]
    command: ["-A", "app.workers.celery_app", "worker", "-B", "--schedule", "/tmp/celerybeat-schedule", "--loglevel=info", "-Q", "default,celery"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - bea_internal

  frontend:
    image: ${BEA_IMAGE_FRONTEND:-bea-digital/frontend}:${BEA_VERSION:?BEA_VERSION manquant}
    pull_policy: missing
    container_name: bea-frontend
    restart: unless-stopped
    logging: *logging
    # Le reverse proxy HTTPS de l'hôte pointe vers cette adresse (voir deployment/nginx/).
    ports:
      - "${BEA_HTTP_BIND:-127.0.0.1:8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bea_internal

volumes:
  postgres_data:
    name: bea_postgres_data

networks:
  bea_internal:
    name: bea_internal
    driver: bridge
