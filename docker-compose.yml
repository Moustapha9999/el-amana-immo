# BEA DIGITAL — instance locale (une seule PostgreSQL 17).
# Démarrage : copier .env.docker.example → .env.docker, puis
#   docker compose --env-file .env.docker up -d
#
# Application : http://localhost
# Ne jamais lancer : docker compose down -v
# (le -v supprime le volume PostgreSQL = perte de la base unique)
#
# SKIP_MIGRATIONS=1 par défaut jusqu'au restore du dump Supabase.
# Alembic sur base vide = schéma faux (1re révision = ALTER de tables déjà présentes).

services:
  postgres:
    # Alpine OK en local. Ne PAS forcer LANG=fr_FR.utf8 :
    # musl accepte le nom de locale mais la collation réelle reste C.
    # TEST/PROD banque : image Debian postgres:17, collation alignée sur le dump.
    image: postgres:17-alpine
    pull_policy: missing
    container_name: bea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bea_digital}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.docker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bea_digital}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bea_internal

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: bea-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bea_internal

  backend:
    image: bea-digital-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: bea-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bea_digital}
      DATABASE_SSL: "false"
      CORS_ORIGINS: http://localhost,http://localhost:80
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-1}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/ged:/app/storage/ged
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bea_internal

  worker:
    image: bea-digital-backend:latest
    pull_policy: missing
    container_name: bea-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bea_digital}
      DATABASE_SSL: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GED_DIR: storage/ged
    volumes:
      - ./storage/ged:/app/storage/ged
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["celery"]
    command: ["-A", "app.workers.celery_app", "worker", "-B", "--schedule", "/tmp/celerybeat-schedule", "--loglevel=info", "-Q", "default,celery"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - bea_internal

  frontend:
    image: bea-digital-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: bea-frontend
    restart: unless-stopped
    # Ouvrir l'application : http://localhost
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bea_internal

  pgadmin:
    # Administration de la base : http://localhost:5050
    # Serveur à déclarer : hôte "postgres", port 5432, base bea_digital.
    image: dpage/pgadmin4
    pull_policy: missing
    container_name: bea-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL manquant dans .env.docker}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD manquant dans .env.docker}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bea_internal

volumes:
  postgres_data:
    # Volume unique BEA DIGITAL. Ne pas en créer un second.
    name: bea_postgres_data
  pgadmin_data:
    # Configuration pgAdmin uniquement (jamais les données PostgreSQL).
    name: bea_pgadmin_data

networks:
  bea_internal:
    name: bea_internal
    driver: bridge
