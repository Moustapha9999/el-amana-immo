# BEA DIGITAL — instance locale (une seule PostgreSQL 17).
# Démarrage : copier .env.docker.example → .env.docker, puis
#   docker compose --env-file .env.docker up -d
#
# Application : http://localhost
# Ne jamais lancer : docker compose down -v
# (le -v supprime le volume PostgreSQL = perte de la base unique)
#
# SKIP_MIGRATIONS=1 par défaut jusqu'au restore du dump Supabase.
# Alembic sur base vide = schéma faux (1re révision = ALTER de tables déjà présentes).

services:
  postgres:
    # Alpine OK en local. Ne PAS forcer LANG=fr_FR.utf8 :
    # musl accepte le nom de locale mais la collation réelle reste C.
    # TEST/PROD banque : image Debian postgres:17, collation alignée sur le dump.
    image: postgres:17-alpine
    pull_policy: missing
    container_name: bea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bea_digital}
      POSTGRES_USER: ${POSTGRES_USER:-immo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.docker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo_user} -d ${POSTGRES_DB:-bea_digital}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bea_internal

  backend:
    image: bea-digital-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: bea-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-immo_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bea_digital}
      DATABASE_SSL: "false"
      CORS_ORIGINS: http://localhost,http://localhost:80
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-1}
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/ged:/app/storage/ged
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bea_internal

  frontend:
    image: bea-digital-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: bea-frontend
    restart: unless-stopped
    # Ouvrir l'application : http://localhost
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bea_internal

volumes:
  postgres_data:
    # Volume unique BEA DIGITAL. Ne pas en créer un second.
    name: bea_postgres_data

networks:
  bea_internal:
    name: bea_internal
    driver: bridge
