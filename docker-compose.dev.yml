# Développement uniquement (hot-reload, Redis/Celery, frontend :4200).
# Usage : docker compose -f docker-compose.dev.yml up
#
# Toujours UNE PostgreSQL par environnement — pas de 2e DB « plateforme ».
# Volume séparé (postgres_data_dev) pour ne pas toucher immo_postgres_data.
# Ne PAS forcer LANG=fr_FR.utf8 sur postgres:17-alpine (collation réelle = C).
# L'instance comptable utilise docker-compose.yml (sans ce fichier).

services:
  postgres:
    image: postgres:17-alpine
    container_name: immo-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immobilisations}
      POSTGRES_USER: ${POSTGRES_USER:-immo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-immo_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo_user} -d ${POSTGRES_DB:-immobilisations}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: immo-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immo-backend-dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-immo_user}:${POSTGRES_PASSWORD:-immo_pass}@postgres:5432/${POSTGRES_DB:-immobilisations}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immo-worker-dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-immo_user}:${POSTGRES_PASSWORD:-immo_pass}@postgres:5432/${POSTGRES_DB:-immobilisations}
      DATABASE_SSL: "false"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["celery"]
    command: ["-A", "app.workers.celery_app", "worker", "--loglevel=info"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: immo-frontend-dev
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
