<app-auth-screen>
  <div class="login-panel">
    <div class="login-panel__icon" aria-hidden="true">
      <mat-icon>lock_reset</mat-icon>
    </div>

    <h2 class="login-panel__title">Nouveau mot de passe</h2>
    <p class="login-panel__lead">
      Choisissez un mot de passe d’au moins 8 caractères.
      @if (secondsLeft() !== null) {
        Lien valide encore <strong>{{ secondsLeft() }} s</strong>.
      }
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-panel__form">
      <input type="hidden" formControlName="token" />

      <div class="login-field login-field--password">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>lock</mat-icon>
        </span>
        <input
          class="login-field__input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="new_password"
          autocomplete="new-password"
          placeholder="Nouveau mot de passe"
          aria-label="Nouveau mot de passe"
        />
        <button
          type="button"
          class="login-field__toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          <mat-icon aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      <div class="login-field login-field--password">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>lock</mat-icon>
        </span>
        <input
          class="login-field__input"
          [type]="showConfirm() ? 'text' : 'password'"
          formControlName="confirm"
          autocomplete="new-password"
          placeholder="Confirmation"
          aria-label="Confirmation mot de passe"
        />
        <button
          type="button"
          class="login-field__toggle"
          (click)="toggleConfirm()"
          [attr.aria-label]="showConfirm() ? 'Masquer la confirmation' : 'Afficher la confirmation'"
        >
          <mat-icon aria-hidden="true">{{ showConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      @if (error()) {
        <p class="login-panel__error">{{ error() }}</p>
      }

      <button type="submit" class="login-panel__submit" [disabled]="loading() || secondsLeft() === 0">
        {{ loading() ? 'ENREGISTREMENT…' : 'ENREGISTRER' }}
      </button>

      <a class="login-panel__back" routerLink="/login">Retour connexion</a>
    </form>
  </div>
</app-auth-screen>
