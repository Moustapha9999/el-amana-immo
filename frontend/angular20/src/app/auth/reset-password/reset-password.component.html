<app-auth-screen>
  <div class="login-panel">
    <div class="login-panel__icon" aria-hidden="true">
      <mat-icon>lock_reset</mat-icon>
    </div>

    <h2 class="login-panel__title">Nouveau mot de passe</h2>
    <p class="login-panel__lead">Collez le token reçu (email ou mode dev), puis choisissez un mot de passe d’au moins 8 caractères.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-panel__form">
      <div class="login-field">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>vpn_key</mat-icon>
        </span>
        <input class="login-field__input" formControlName="token" placeholder="Token" aria-label="Token de réinitialisation" />
      </div>

      <div class="login-field">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>lock</mat-icon>
        </span>
        <input
          class="login-field__input"
          type="password"
          formControlName="new_password"
          autocomplete="new-password"
          placeholder="Nouveau mot de passe"
          aria-label="Nouveau mot de passe"
        />
      </div>

      <div class="login-field">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>lock</mat-icon>
        </span>
        <input
          class="login-field__input"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
          placeholder="Confirmation"
          aria-label="Confirmation mot de passe"
        />
      </div>

      @if (error()) {
        <p class="login-panel__error">{{ error() }}</p>
      }

      <button type="submit" class="login-panel__submit" [disabled]="loading()">
        {{ loading() ? 'ENREGISTREMENT…' : 'ENREGISTRER' }}
      </button>

      <a class="login-panel__back" routerLink="/login">Retour connexion</a>
    </form>
  </div>
</app-auth-screen>
