<app-auth-screen>
  <div class="login-panel">
    <div class="login-panel__icon" aria-hidden="true">
      <mat-icon>groups</mat-icon>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-panel__form">
      <div class="login-field">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>person</mat-icon>
        </span>
        <input
          class="login-field__input"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="Email"
          aria-label="Email"
        />
      </div>

      <div class="login-field login-field--password">
        <span class="login-field__icon" aria-hidden="true">
          <mat-icon>lock</mat-icon>
        </span>
        <input
          class="login-field__input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Mot de passe"
          aria-label="Mot de passe"
        />
        <button
          type="button"
          class="login-field__toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          [attr.aria-pressed]="showPassword()"
        >
          <mat-icon aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      @if (totpRequired()) {
        <div class="login-field">
          <span class="login-field__icon" aria-hidden="true">
            <mat-icon>pin</mat-icon>
          </span>
          <input
            class="login-field__input"
            formControlName="totp_code"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="Code 2FA"
            aria-label="Code 2FA"
          />
        </div>
      }

      <div class="login-panel__options">
        <mat-checkbox formControlName="remember_me" color="primary">Se souvenir de moi</mat-checkbox>
      </div>

      @if (info()) {
        <p class="login-panel__success">{{ info() }}</p>
      }
      @if (error()) {
        <p class="login-panel__error">{{ error() }}</p>
      }

      <button type="submit" class="login-panel__submit" [disabled]="loading()">
        {{ loading() ? 'CONNEXION…' : 'CONNEXION' }}
      </button>
    </form>
  </div>
</app-auth-screen>
