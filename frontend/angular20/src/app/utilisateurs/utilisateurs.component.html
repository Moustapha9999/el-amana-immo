<h2 class="text-xl font-semibold mb-4">Utilisateurs & rôles</h2>

@if (error()) {
  <p class="text-sm text-red-600 mb-4">{{ error() }}</p>
}

<table mat-table [dataSource]="rows()" class="w-full bg-white rounded shadow-sm">
  <ng-container matColumnDef="full_name">
    <th mat-header-cell *matHeaderCellDef>Nom</th>
    <td mat-cell *matCellDef="let row">{{ row.full_name }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let row">{{ row.email }}</td>
  </ng-container>
  <ng-container matColumnDef="roles">
    <th mat-header-cell *matHeaderCellDef>Rôles</th>
    <td mat-cell *matCellDef="let row">{{ rolesLabel(row) }}</td>
  </ng-container>
  <ng-container matColumnDef="superuser">
    <th mat-header-cell *matHeaderCellDef>Superuser</th>
    <td mat-cell *matCellDef="let row">{{ row.is_superuser ? 'Oui' : 'Non' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
