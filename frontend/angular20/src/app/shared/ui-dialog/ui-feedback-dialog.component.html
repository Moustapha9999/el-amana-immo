<div class="ui-dlg" [attr.data-tone]="tone">
  <div class="ui-dlg__icon" aria-hidden="true">
    <mat-icon>{{ data.icon || 'info' }}</mat-icon>
  </div>
  <h2 class="ui-dlg__title" mat-dialog-title>{{ data.title }}</h2>
  <div mat-dialog-content class="ui-dlg__body">
    <p class="ui-dlg__message">{{ data.message }}</p>
  </div>
  <div mat-dialog-actions class="ui-dlg__actions ui-dlg__actions--single">
    <button mat-flat-button color="primary" type="button" (click)="close()">
      {{ data.okLabel || 'OK' }}
    </button>
  </div>
</div>
