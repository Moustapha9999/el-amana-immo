<div class="mb-4">
  <h2 class="text-xl font-semibold">Mises au rebut</h2>
  <p class="text-sm text-slate-500 mt-1">Sorties sans cession (perte comptable sur VNC)</p>
</div>

<table mat-table [dataSource]="rows()" class="w-full bg-white rounded shadow-sm">
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let row">{{ row.date_rebut | date: 'dd/MM/yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef>Code</th>
    <td mat-cell *matCellDef="let row">{{ row.code_inventaire ?? '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="designation">
    <th mat-header-cell *matHeaderCellDef>Désignation</th>
    <td mat-cell *matCellDef="let row">{{ row.designation ?? '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="vnc">
    <th mat-header-cell *matHeaderCellDef>VNC</th>
    <td mat-cell *matCellDef="let row">{{ row.vnc | number: '1.2-2' }}</td>
  </ng-container>
  <ng-container matColumnDef="motif">
    <th mat-header-cell *matHeaderCellDef>Motif</th>
    <td mat-cell *matCellDef="let row">{{ row.motif ?? '—' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row">
      <a mat-button [routerLink]="['/immobilisations', row.immobilisation_id]">Fiche</a>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
