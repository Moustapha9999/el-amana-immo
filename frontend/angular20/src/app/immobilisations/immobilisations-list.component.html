<app-page-header title="Immobilisations" subtitle="Parc actif — codes inventaire, catégories TY-142 et valeurs brutes.">
  <a mat-flat-button color="primary" routerLink="/immobilisations/nouveau">Nouvelle immobilisation</a>
</app-page-header>

<div class="app-panel">
  <table mat-table [dataSource]="rows()" class="w-full app-table">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code inventaire</th>
      <td mat-cell *matCellDef="let row">{{ row.code_inventaire }}</td>
    </ng-container>
    <ng-container matColumnDef="designation">
      <th mat-header-cell *matHeaderCellDef>Désignation</th>
      <td mat-cell *matCellDef="let row">{{ row.designation }}</td>
    </ng-container>
    <ng-container matColumnDef="famille">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let row">{{ row.categorie?.famille ?? '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="valeur">
      <th mat-header-cell *matHeaderCellDef>Valeur brute</th>
      <td mat-cell *matCellDef="let row">{{ row.valeur_brute | number: '1.2-2' }}</td>
    </ng-container>
    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let row">{{ statutLabel(row.statut) }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button [routerLink]="['/immobilisations', row.id]">Ouvrir</a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
